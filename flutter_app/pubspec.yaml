name: srilambo_vpn
description: "A clean, fast VPN app for Android & iOS using WireGuard protocol."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # VPN — WireGuard cross-platform (Android + iOS)
  wireguard_flutter: ^0.1.3

  # Google Fonts — Inter font (no local files needed)
  google_fonts: ^6.2.1

  # State management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.6.0
  pretty_dio_logger: ^1.3.1

  # Secure storage (auth token)
  flutter_secure_storage: ^9.2.2

  # Local storage (preferences)
  shared_preferences: ^2.3.1

  # Navigation
  go_router: ^14.2.7

  # UI helpers
  animate_do: ^3.3.4
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Icons
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Fonts loaded via google_fonts package — no local files needed
